apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-ui
  namespace: resume-screening
  labels:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: group179
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-screening
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-screening
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: group179
    spec:
      containers:
        - name: ui
          image: group179-resume-screening:latest
          imagePullPolicy: Never
          args:
            - streamlit
            - run
            - streamlit_app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resume-ui
  namespace: resume-screening
  labels:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8501
      targetPort: http
