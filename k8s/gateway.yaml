apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-gateway
  namespace: resume-screening
  labels:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: gateway
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 6m;

        location = /gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location /health {
            proxy_pass http://resume-api:8000;
        }

        location /docs {
            proxy_pass http://resume-api:8000;
        }

        location /redoc {
            proxy_pass http://resume-api:8000;
        }

        location /openapi.json {
            proxy_pass http://resume-api:8000;
        }

        location /predict {
            proxy_pass http://resume-api:8000;
        }

        location /v1/ {
            proxy_pass http://resume-api:8000;
        }

        location /metrics {
            proxy_pass http://resume-api:8000;
        }

        location / {
            proxy_pass http://resume-ui:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-gateway
  namespace: resume-screening
  labels:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: group179
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-screening
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-screening
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: group179
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /gateway-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: resume-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: resume-gateway
  namespace: resume-screening
  labels:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: resume-screening
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
